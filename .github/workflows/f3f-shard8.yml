{
  "name": "F3F Shard 8 diagnostic only",
  "on": {
    "push": {
      "branches": [
        "codex/f3f-shard8-diagnostic"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "f3f-shard8-diagnostic",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnostic": {
      "name": "F3F isolated Shard 8 diagnostic",
      "if": "${{ github.repository == 'MilJav11/triglav-harness' && github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.run_attempt == 1 }}",
      "runs-on": "windows-2025",
      "timeout-minutes": 12,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "env": {
        "TRIGLAV_CI_EXPECTED_HEAD": "${{ github.sha }}",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUTF8": "1",
        "F3F_LAUNCHER_SHA256": "ef4334e4a035c254331f915b322067bc5960b1e5dbc38abfcd135b8d9152ce0a"
      },
      "steps": [
        {
          "name": "Bind original job start before checkout and Python setup",
          "env": {
            "F3F_API_TOKEN": "${{ github.token }}"
          },
          "run": "$ErrorActionPreference = 'Stop'\n$headers = @{ Authorization = \"Bearer $env:F3F_API_TOKEN\"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }\n$uri = \"https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/1/jobs?per_page=100\"\n$response = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 15\n$jobs = @($response.jobs | Where-Object { $_.name -ceq 'F3F isolated Shard 8 diagnostic' -and $_.status -eq 'in_progress' })\nif ($jobs.Count -ne 1 -or -not $jobs[0].started_at) { throw 'Cannot bind job start time' }\n$started = [DateTimeOffset]$jobs[0].started_at\n$elapsed = ([DateTimeOffset]::UtcNow - $started).TotalSeconds\nif ($elapsed -lt 0 -or $elapsed -ge 630) { throw 'Global setup budget exhausted' }\n\"F3F_JOB_STARTED_AT=$($started.ToUniversalTime().ToString('o'))\" >> $env:GITHUB_ENV\n# Branch recreation can retrigger attempt 1; these gates are not a replay ledger.\ngit config --global core.autocrlf false\nif ($LASTEXITCODE -ne 0) { throw 'Cannot preserve reviewed source bytes' }\n"
        },
        {
          "name": "Check out immutable diagnostic snapshot",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 2,
            "persist-credentials": false,
            "submodules": false,
            "lfs": false
          }
        },
        {
          "name": "Set up exact Python 3.12.10 x64",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12.10",
            "architecture": "x64"
          }
        },
        {
          "name": "Verify digest and run exactly one diagnostic case",
          "run": "$ErrorActionPreference = 'Stop'\n$path = '.github/diagnostics/f3f_shard8.py'\n$actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($actual -cne $env:F3F_LAUNCHER_SHA256) { throw 'Launcher source digest mismatch' }\n$manifest = (Get-FileHash -LiteralPath 'scripts/ci_manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($manifest -cne '0c3013b553035710a3a89e0b65cc4fa4c470f34f4ccaadf2669398f74160ff74') { throw 'Reviewed manifest digest mismatch' }\npython -B $path\nexit $LASTEXITCODE\n"
        },
        {
          "name": "Upload only bounded sanitized evidence; never qualification",
          "if": "${{ always() && hashFiles('runs/ci/f3f-shard8/evidence.json') != '' }}",
          "timeout-minutes": 1,
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "f3f-shard8-${{ github.run_id }}.1",
            "path": "runs/ci/f3f-shard8/evidence.json",
            "if-no-files-found": "error",
            "retention-days": 7,
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
