# Legacy custom-executor template: replace fictional C:/TRIGLAV-runtime paths.
# llama-swap v260. Start with -listen 127.0.0.1:9292; dedicate this instance to the harness.
# Edit paths/arguments here when changing a role's backing model.
healthCheckTimeout: 900
unloadTimeout: 30
globalTTL: 300
startPort: 5900
logToStdout: "proxy,upstream,http"
models:
  llm-code:
    cmd: >-
      "C:/TRIGLAV-runtime/llama.cpp/llama-server.exe"
      --model "C:/TRIGLAV-runtime/models/qwen/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      --ctx-size 32768 --threads 8 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --fit on --fit-target 768
    # The default Windows taskkill command is blocked in this workstation's
    # restricted session. Stop the exact child PID through PowerShell instead.
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    ttl: 300
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      context: 32768
  llm-critic:
    cmd: >-
      "C:/TRIGLAV-runtime/llama.cpp/llama-server.exe"
      --model "C:/TRIGLAV-runtime/models/nemotron/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      --ctx-size 4096 --parallel 1 --threads 8 --threads-batch 8
      --batch-size 256 --ubatch-size 128 --cpu-moe --gpu-layers auto
      --fit on --fit-target 1024 --spec-type none
      --reasoning on --reasoning-format deepseek --reasoning-budget 768
      --offline --no-webui --no-agent --no-ui-mcp-proxy --no-mmproj
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    ttl: 300
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      context: 4096
  llm-review:
    cmd: >-
      "C:/TRIGLAV-runtime/hotpin/llama-server.exe"
      --model "C:/TRIGLAV-runtime/models/gptoss/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf"
      --host 127.0.0.1 --port ${PORT}
      --ctx-size 8192 --threads 8 --flash-attn on
      --fit on --fit-target 768 --no-repack --mmap --verbosity 4
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    env:
      - "LLAMA_HOT_EXPERTS=@REVIEW_HOT_EXPERTS@"
    ttl: 300
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      context: 8192
