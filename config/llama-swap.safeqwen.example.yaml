# Schematic only. See docs/WINDOWS_SETUP.md before use; no live qualification.
# Replace C:/TRIGLAV-runtime with your absolute runtime directory everywhere.
# JSON runtime identities must resolve to the SAME files as these commands.
# Keep each entire command on ONE line for safe_executor_binding.model_starting.
# No autoload/preload: dedicate the gateway to sequential controller-owned roles.
healthCheckTimeout: 900
unloadTimeout: 30
globalTTL: 300
startPort: 5900
models:
  qwen-code:
    cmd: >-
      "C:/TRIGLAV-runtime/llama.cpp/llama-server.exe" --model "C:/TRIGLAV-runtime/models/qwen/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf" --host 127.0.0.1 --port ${PORT} --ctx-size 32768 --threads 8 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --fit on --fit-target 768
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    ttl: 300
    checkEndpoint: /health
  nemotron-critic:
    cmd: >-
      "C:/TRIGLAV-runtime/llama.cpp/llama-server.exe" --model "C:/TRIGLAV-runtime/models/nemotron/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_K_M.gguf" --host 127.0.0.1 --port ${PORT} --ctx-size 4096 --parallel 1 --threads 8 --threads-batch 8 --batch-size 256 --ubatch-size 128 --cpu-moe --gpu-layers auto --fit on --fit-target 1024 --spec-type none --reasoning on --reasoning-format deepseek --reasoning-budget 768 --offline --no-webui --no-agent --no-ui-mcp-proxy --no-mmproj
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    ttl: 300
    checkEndpoint: /health
  gptoss-review:
    cmd: >-
      "C:/TRIGLAV-runtime/hotpin/llama-server.exe" --model "C:/TRIGLAV-runtime/models/gptoss/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf" --host 127.0.0.1 --port ${PORT} --ctx-size 8192 --threads 8 --flash-attn on --fit on --fit-target 768 --no-repack --mmap --verbosity 4
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    env:
      - "LLAMA_HOT_EXPERTS=C:/TRIGLAV-runtime/hot_top4.txt"
    ttl: 300
    checkEndpoint: /health
# This env declaration does not verify inheritance or enforce a working-set cap.
# SafeQwen currently cannot express Phase 8B's checked Top4 / 32 GiB policy.
