# Code-only schematic. Replace C:/TRIGLAV-runtime with your absolute runtime root.
# Match the same files in config/safeqwen.local.json; no preload or extra roles.
healthCheckTimeout: 900
unloadTimeout: 30
globalTTL: 300
startPort: 5900
models:
  qwen-code:
    cmd: >-
      "C:/TRIGLAV-runtime/llama-server.exe" --model "C:/TRIGLAV-runtime/qwen-model.gguf" --host 127.0.0.1 --port ${PORT} --ctx-size 32768 --threads 8 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --fit on --fit-target 768
    cmdStop: 'powershell.exe -NoProfile -NonInteractive -Command "Stop-Process -Id ${PID} -ErrorAction Stop"'
    ttl: 300
    checkEndpoint: /health
